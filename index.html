<!doctype html>
<html lang="ka">
	<head>
		<meta charset="UTF-8" />
		<title>lesson 22</title>
		<script src="app.js" defer></script>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<section class="container">
			<!-- <img src="https://fastly.picsum.photos/id/566/200/300.jpg?hmac=gDpaVMLNupk7AufUDLFHttohsJ9-C17P7L-QKsVgUQU" alt="" /> -->
			<form id="add-form">
				<h2>ახალი პროდუქტის დამატება</h2>

				<div class="form-group">
					<label for="title">სათაური:</label>
					<input type="text" id="title" placeholder="მაგ: iPhone 15 Pro" required />
				</div>
				<div class="form-group">
					<label for="price">ფასი ($):</label>
					<input type="number" id="price" step="0.01" placeholder="999" required />
				</div>
				<div class="form-group">
					<label for="discount">ფასდაკლება (%):</label>
					<input type="number" id="discount" step="0.1" placeholder="10" />
				</div>
				<div class="form-group">
					<label for="category">კატეგორია:</label>
					<select id="category">
						<option value=""></option>
						<option value="smartphones">Smartphones</option>
						<option value="laptops">Laptops</option>
						<option value="fragrances">Fragrances</option>
						<option value="groceries">Groceries</option>
					</select>
				</div>
				<div class="form-group">
					<label for="image">სურათის URL:</label>
					<input type="url" id="image" value="https://fastly.picsum.photos/id/566/200/300.jpg?hmac=gDpaVMLNupk7AufUDLFHttohsJ9-C17P7L-QKsVgUQU" />
				</div>
				<button type="submit">პროდუქტის დამატება</button>
			</form>
		</section>

		<section class="container">
			<h2>Products list</h2>
			<ul class="products-list"></ul>
		</section>
	</body>
</html>
